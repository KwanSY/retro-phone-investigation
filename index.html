        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
            if (typeof radius === 'undefined') radius = 5;
            if (typeof radius === 'number') radius = {tl: radius, tr: radius, br: radius, bl: radius};
            ctx.beginPath();
            ctx.moveTo(x + radius.tl, y);
            ctx.lineTo(x + width - radius.tr, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
            ctx.lineTo(x + width, y + height - radius.br);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
            ctx.lineTo(x + radius.bl, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
            ctx.lineTo(x, y + radius.tl);
            ctx.quadraticCurveTo(x, y, x + radius.tl, y);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let paragraphs = text.split('\n');
            let totalHeight = 0;
            for(let p=0; p<paragraphs.length; p++) {
                let words = paragraphs[p].split('');
                let line = '';
                for(let n = 0; n < words.length; n++) {
                    let testLine = line + words[n];
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(line, x, y);
                        line = words[n];
                        y += lineHeight; totalHeight += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, y);
                y += lineHeight; totalHeight += lineHeight;
            }
            return totalHeight;
        }

        function drawStartScreen() {
            let w = canvas.width, h = canvas.height;
            if (w === 0 || h === 0) return;

            let bgGrad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, Math.max(w, h));
            bgGrad.addColorStop(0, '#101726'); bgGrad.addColorStop(1, '#05080f');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, w, h);

            // 雷达网格
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)'; ctx.lineWidth = 1;
            for(let i=0; i<w; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
            for(let i=0; i<h; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i); ctx.stroke(); }

            ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 32px "Helvetica Neue", Arial'; ctx.textAlign = 'center';
            ctx.fillText("电子物证鉴定中心 :: 设备阵列", w/2, 80);
            ctx.font = '16px Arial'; ctx.fillStyle = '#888';
            ctx.fillText("请选择授权破解的终端设备进行接入", w/2, 110);

            // 绘制10台手机阵列 (2排 x 5列)
            let cols = 5; let rows = 2;
            let spacingX = 180; let spacingY = 220;
            let startX = w/2 - (cols * spacingX) / 2 + spacingX/2;
            let startY = h/2 - 100;

            for (let i = 0; i < 10; i++) {
                let row = Math.floor(i / cols); let col = i % cols;
                let bx = startX + col * spacingX - 60; let by = startY + row * spacingY - 80;
                let bw = 120; let bh = 180;

                let isHover = mouseX >= bx && mouseX <= bx+bw && mouseY >= by && mouseY <= by+bh;
                let isTarget = (i === 2); // 第3台是赵磊
                let isSecond = (i === 1 && secondPhoneVisible); // 第2台是阿树

                if (isTarget) {
                    ctx.fillStyle = isHover ? 'rgba(0, 243, 255, 0.2)' : 'rgba(0, 243, 255, 0.05)';
                    ctx.strokeStyle = isHover ? '#00f3ff' : '#0099aa';
                    ctx.lineWidth = isHover ? 3 : 1;
                } else if (isSecond) {
                    ctx.fillStyle = isHover ? 'rgba(241, 196, 15, 0.2)' : 'rgba(241, 196, 15, 0.05)';
                    ctx.strokeStyle = isHover ? '#f1c40f' : '#b89214';
                    ctx.lineWidth = isHover ? 3 : 1;
                } else {
                    ctx.fillStyle = 'rgba(255, 50, 50, 0.05)';
                    ctx.strokeStyle = '#552222'; ctx.lineWidth = 1;
                }
                
                roundRect(ctx, bx, by, bw, bh, 10, true, true);

                // 手机简易图标
                ctx.fillStyle = isTarget ? '#00f3ff' : (isSecond ? '#f1c40f' : '#552222');
                roundRect(ctx, bx + 30, by + 20, 60, 100, 5, true, false);

                ctx.font = '14px Arial';
                if (isTarget) {
                    ctx.fillStyle = '#00f3ff'; ctx.fillText("S40-PROJ", bx + bw/2, by + 145);
                    ctx.fillStyle = '#0f0'; ctx.font = '12px Arial'; ctx.fillText("[ 赵磊终端 ]", bx + bw/2, by + 165);
                    addRegion(bx, by, bw, bh, () => { gameState = 'DESKTOP'; currentApp = 'desktop'; scrollY = 0; });
                } else if (isSecond) {
                    ctx.fillStyle = '#f1c40f'; ctx.fillText("S40-02", bx + bw/2, by + 145);
                    ctx.fillStyle = secondPhoneUnlocked ? '#0f0' : '#e74c3c'; ctx.font = '12px Arial'; 
                    ctx.fillText(secondPhoneUnlocked ? "[ 阿树终端 ]" : "[ 密码锁定 ]", bx + bw/2, by + 165);
                    addRegion(bx, by, bw, bh, () => { 
                        if (secondPhoneUnlocked) {
                            gameState = 'ASHU_PHONE';
                        } else {
                            gameState = 'PASSWORD_INPUT'; inputPassword = "";
                        }
                    });
                } else {
                    ctx.fillStyle = '#552222'; ctx.fillText("UNKNOWN", bx + bw/2, by + 145);
                    ctx.fillStyle = '#f00'; ctx.font = '12px Arial'; ctx.fillText("[ 物理损坏 ]", bx + bw/2, by + 165);
                }
            }
            ctx.textAlign = 'left';
        }

        function drawAppGrid(sx, sy, sw, sh) {
            ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign='center';
            ctx.fillText("— [ 核心数据分析 ] —", sx + sw/2, sy + 35);
            
            let cols = 2; 
            let itemW = 150; let itemH = 120;
            let paddingX = 20; let paddingY = 20;
            let totalGridW = cols * itemW + (cols - 1) * paddingX;
            let startX = sx + (sw - totalGridW) / 2;
            let startY = sy + 65;

            for (let i = 0; i < appsList.length; i++) {
                let col = i % cols; let row = Math.floor(i / cols);
                let bx = startX + col * (itemW + paddingX);
                let by = startY + row * (itemH + paddingY);

                let isHover = mouseX >= bx && mouseX <= bx + itemW && mouseY >= by && mouseY <= by + itemH;
                
                ctx.fillStyle = isHover ? 'rgba(0, 243, 255, 0.2)' : 'rgba(255,255,255,0.05)';
                ctx.strokeStyle = isHover ? '#f1c40f' : 'rgba(0, 243, 255, 0.3)'; ctx.lineWidth = 2;
                roundRect(ctx, bx, by, itemW, itemH, 12, true, true);

                ctx.fillStyle = appsList[i].color; ctx.font = '40px Arial';
                ctx.fillText(appsList[i].icon, bx + itemW/2, by + 50);
                
                ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial';
                ctx.fillText(appsList[i].name, bx + itemW/2, by + 90);

                let hasUnreadFerryman = db.whale_chat.some(s => s.id === 'ferryman_q1');
                if (appsList[i].id === 'whale_app' && ferrymanTriggered && hasUnreadFerryman) {
                    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(bx + itemW - 15, by + 15, 8, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.fillText("1", bx + itemW - 15, by + 19);
                }

                addRegion(bx, by, itemW, itemH, () => {
                    appsOpened.add(appsList[i].id);
                    currentApp = appsList[i].id; scrollY = 0;
                });
            }
            ctx.textAlign = 'left';
        }

        function drawIMG001(ctx, bx, by, imgW, imgH) {
            ctx.save(); ctx.beginPath(); ctx.rect(bx, by, imgW, imgH); ctx.clip();
            ctx.fillStyle = '#5d4037'; ctx.fillRect(bx, by, imgW, imgH);
            
            let gradient = ctx.createRadialGradient(bx+imgW*0.8, by+imgH*0.2, 10, bx+imgW*0.8, by+imgH*0.2, imgW);
            gradient.addColorStop(0, '#ff8a65'); gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = gradient; ctx.fillRect(bx, by, imgW, imgH);
            
            ctx.fillStyle = '#111'; ctx.beginPath();
            ctx.arc(bx+imgW*0.4, by+imgH*0.5, 25, 0, Math.PI*2); 
            ctx.moveTo(bx+imgW*0.4-20, by+imgH*0.5+10); ctx.lineTo(bx+imgW*0.4-30, by+imgH);
            ctx.lineTo(bx+imgW*0.4+50, by+imgH); ctx.lineTo(bx+imgW*0.4+20, by+imgH*0.5+20);
            ctx.fill();
            
            ctx.strokeStyle = '#222'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(bx+imgW*0.7, by); ctx.lineTo(bx+imgW*0.7, by+imgH); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(bx+imgW*0.7, by+imgH*0.4); ctx.lineTo(bx+imgW, by+imgH*0.4); ctx.stroke();
            ctx.restore();
        }

        function drawWhaleChat(sx, sy, sw, sh) {
            let cy = sy + 40 - scrollY; 
            
            ctx.fillStyle = '#0a0d12'; ctx.fillRect(sx, sy, sw, sh);
            if (cy > sy - 50 && cy < sy + sh) {
                ctx.fillStyle = '#1abc9c'; ctx.font = 'bold 14px "Courier New"'; ctx.textAlign = 'center';
                ctx.fillText("--- W.H.A.L.E. SECURE NODE ---", sx + sw/2, cy);
                ctx.textAlign = 'left';
            }
            cy += 40;

            for (let m of db.whale_chat) {
                let isMe = m.type === 'me';
                let hasImg = m.text.includes('【附件：IMG_001】');
                let displayTxt = m.text.replace('【附件：IMG_001】', '').trim();
                
                ctx.fillStyle = '#555'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
                if(cy > sy && cy < sy + sh) ctx.fillText(m.time, sx + sw/2, cy);
                ctx.textAlign = 'left';
                cy += 20;
                
                // 【修复2】提前设置正确的字体大小，避免因为测量字体小、渲染字体大导致的错误折行
                ctx.font = '14px Arial'; 
                let textW = ctx.measureText(displayTxt).width;
                // 适当放大边界限制，确保标点符号不会卡在边缘折行
                let bw = hasImg ? sw * 0.7 : Math.min(textW + 32, sw * 0.7);
                let maxW = bw - 24; // 文本渲染时的严格最大宽度
                let bx = isMe ? sx + sw - bw - 15 : sx + 15;
                
                let bubbleH = 16; // 缩减基础留白（上下各约8px）
                if (hasImg) bubbleH += 145;
                let fakeP = displayTxt.split('\n');
                let lineCount = 0;
                for(let p of fakeP) {
                    if (p === '') continue;
                    let words = p.split(''); let line = '';
                    for(let n=0; n<words.length; n++) {
                        let testLine = line + words[n];
                        if(ctx.measureText(testLine).width > maxW && n > 0) { lineCount++; line = words[n]; }
                        else { line = testLine; }
                    }
                    lineCount++;
                }
                if(lineCount === 0 && hasImg) lineCount = 0;
                bubbleH += lineCount * 20;
                // 去除了原本冗余的额外加高逻辑，使得高度刚好包覆
                
                if (!hasImg && lineCount === 1) bw = Math.min(textW + 32, sw*0.7);
                if (isMe) bx = sx + sw - bw - 15;

                if (cy + bubbleH > sy && cy < sy + sh) {
                    ctx.fillStyle = isMe ? '#0e6655' : '#1b2631';
                    roundRect(ctx, bx, cy, bw, bubbleH, 8, true, false);
                    
                    let textY = cy + 22; // 将文字基线恰好落在气泡的视觉中心线上
                    if (hasImg) {
                        drawIMG001(ctx, bx + 10, cy + 10, bw - 20, 140);
                        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.strokeRect(bx + 10, cy + 10, bw - 20, 140);
                        textY += 145;
                    }
                    
                    ctx.fillStyle = '#1abc9c'; ctx.font = '14px Arial';
                    if(displayTxt) wrapText(ctx, displayTxt, bx + 12, textY, maxW, 20);
                }
                cy += bubbleH + 20;
            }

            // 【修复1】把摆渡人的交互选项逻辑移到消息循环外面，让其永远渲染在对话最底部
            let activeQuest = db.whale_chat.find(m => m.id === 'ferryman_q1');
            if (activeQuest && !evidenceDestroyed) {
                if (!showFerrymanOptions) {
                    let btnY = cy;
                    if (btnY + 45 > sy && btnY < sy + sh) {
                        ctx.fillStyle = '#e74c3c'; roundRect(ctx, sx+20, btnY, sw-40, 45, 5, true, false);
                        ctx.fillStyle = '#fff'; ctx.textAlign='center'; ctx.font='bold 14px Arial'; ctx.fillText("[ 拦截到高权限交互指令，点击回复 ]", sx+sw/2, btnY+28); ctx.textAlign='left';
                        addRegion(sx+20, btnY, sw-40, 45, () => { showFerrymanOptions = true; scrollY = 0; });
                    }
                    cy += 65;
                } else {
                    let options = [
                        { id: 'A', text: "旧城书话。她聊《人间失格》，我接的话。" },
                        { id: 'B', text: "同学介绍的。" },
                        { id: 'C', text: "书店。她在看《人间失格》，我搭的话。" }
                    ];
                    for (let opt of options) {
                        let optBx = sx + 20, optBy = cy, optBh = 50;
                        let isClicked = ferrymanClickedOptions.has(opt.id);
                        
                        if (optBy + optBh > sy && optBy < sy + sh) {
                            let isHover = !isClicked && mouseX >= optBx && mouseX <= optBx + sw - 40 && mouseY >= optBy && mouseY <= optBy + optBh;
                            
                            ctx.fillStyle = isClicked ? 'rgba(100, 100, 100, 0.2)' : (isHover ? 'rgba(26, 188, 156, 0.4)' : 'rgba(26, 188, 156, 0.1)');
                            ctx.strokeStyle = isClicked ? '#555' : '#1abc9c'; 
                            ctx.lineWidth = 1; 
                            roundRect(ctx, optBx, optBy, sw - 40, optBh, 6, true, true);
                            
                            ctx.fillStyle = isClicked ? '#777' : '#1abc9c'; ctx.font='14px Arial'; 
                            ctx.fillText(opt.id + ". " + opt.text, optBx + 15, optBy + 30);
                            
                            if (!isClicked) {
                                addRegion(optBx, optBy, sw-40, optBh, () => {
                                    // 将玩家选择的内容作为真实的聊天气泡发送出去
                                    db.whale_chat.push({ id: 'f_reply_' + opt.id, type: 'me', sender: '石头', time: '刚刚', text: opt.text });
                                    
                                    if (opt.id === 'A') {
                                        activeQuest.id = 'ferryman_q1_done';
                                        db.whale_chat.push({ id: 'f_ok', type: 'other', sender: '摆渡人', time: '刚刚', text: '记得挺牢。明天开始，让她多讲讲她家里。' });
                                        secondPhoneVisible = true;
                                        scrollY += 100; // 自动向下滚动查看新消息
                                    } else {
                                        ferrymanClickedOptions.add(opt.id);
                                        ferrymanFailedCount++;
                                        if (ferrymanFailedCount === 1) {
                                            db.whale_chat.push({ id: 'f_warn', type: 'other', sender: '摆渡人', time: '刚刚', text: '不对。你不是他。' });
                                            // 自动向下滚动一点，确保能看到新消息和新选项
                                            scrollY += 100; 
                                        } else if (ferrymanFailedCount === 2) {
                                            activeQuest.id = 'ferryman_q1_done'; 
                                            db.whale_chat.push({ id: 'f_die1', type: 'other', sender: '摆渡人', time: '刚刚', text: '手机落到别人手里了。' });
                                            scrollY = maxScrollY + 100; // 滚到底部
                                            
                                            // Game Over 序列播放
                                            setTimeout(() => {
                                                db.whale_chat.push({ id: 'f_die2', type: 'other', sender: '摆渡人', time: '刚刚', text: '那就都别要了。' });
                                                
                                                setTimeout(() => {
                                                    evidenceDestroyed = true;
                                                    currentApp = 'desktop'; // 强制踢出应用
                                                    
                                                    // 删除失眠的鲸
                                                    let appIdx = appsList.findIndex(a => a.id === 'whale_app');
                                                    if (appIdx !== -1) appsList.splice(appIdx, 1);
                                                    
                                                    // 在桌面停留1.5秒后爆出 Game Over
                                                    setTimeout(() => {
                                                        gameState = 'GAME_OVER';
                                                    }, 1500);
                                                    
                                                }, 2500); 
                                            }, 2000); 
                                        }
                                    }
                                });
                            }
                        }
                        cy += optBh + 15;
                    }
                }
            }
            maxScrollY = Math.max(0, cy + scrollY - (sy + sh) + 50);
        }

        function drawGalleryDetail(sx, sy, sw, sh) {
            let img = db.gallery.find(i => i.id === selectedImgId);
            if (!img) return;

            let bx = sx + 20, by = sy + 60 - scrollY, imgW = sw - 40, imgH = 260;
            
            // 摧毁判定
            if (evidenceDestroyed && (img.id === 'img_009' || img.id === 'img_010')) {
                ctx.fillStyle = '#1a0000'; ctx.fillRect(bx, by, imgW, imgH);
                ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, imgW, imgH);
                ctx.fillStyle = '#ff0000'; ctx.font = 'bold 20px Arial'; ctx.textAlign='center'; ctx.fillText("[ 数据已损坏 ]", bx+imgW/2, by+imgH/2);
                ctx.font = '12px Arial'; ctx.fillText("摆渡人已远程执行销毁协议", bx+imgW/2, by+imgH/2+30); ctx.textAlign='left';
                return;
            }

            ctx.save(); ctx.beginPath(); ctx.rect(bx, by, imgW, imgH); ctx.clip();
            
            if (img.type.startsWith('scene')) {
                ctx.fillStyle = img.type === 'scene_window' ? '#5d4037' : (img.type === 'scene_eat' ? '#37474f' : '#33691e');
                ctx.fillRect(bx, by, imgW, imgH);
                
                let gradient = ctx.createRadialGradient(bx+imgW*0.8, by+imgH*0.2, 10, bx+imgW*0.8, by+imgH*0.2, imgW);
                if(img.type === 'scene_window') { gradient.addColorStop(0, '#ff8a65'); gradient.addColorStop(1, 'rgba(0,0,0,0.6)'); } // 逆光
                if(img.type === 'scene_eat') { gradient.addColorStop(0, '#90a4ae'); gradient.addColorStop(1, 'rgba(0,0,0,0.7)'); } // 食堂
                if(img.type === 'scene_bus') { gradient.addColorStop(0, '#fff59d'); gradient.addColorStop(1, 'rgba(0,0,0,0.7)'); } // 路灯
                ctx.fillStyle = gradient; ctx.fillRect(bx, by, imgW, imgH);
                
                // 剪影
                ctx.fillStyle = '#111'; ctx.beginPath();
                if(img.type === 'scene_window') {
                    ctx.arc(bx+imgW*0.4, by+imgH*0.5, 25, 0, Math.PI*2); 
                    ctx.moveTo(bx+imgW*0.4-20, by+imgH*0.5+10); ctx.lineTo(bx+imgW*0.4-30, by+imgH);
                    ctx.lineTo(bx+imgW*0.4+50, by+imgH); ctx.lineTo(bx+imgW*0.4+20, by+imgH*0.5+20);
                } else if (img.type === 'scene_eat') {
                    ctx.arc(bx+imgW*0.5, by+imgH*0.6, 20, 0, Math.PI*2); 
                    ctx.fillRect(bx+imgW*0.5-25, by+imgH*0.6+15, 50, imgH);
                    ctx.fillStyle = '#333'; ctx.fillRect(bx, by+imgH-30, imgW, 30);
                } else {
                    ctx.arc(bx+imgW*0.7, by+imgH*0.6, 20, 0, Math.PI*2); 
                    ctx.fillRect(bx+imgW*0.7-15, by+imgH*0.6+15, 30, imgH);
                }
                ctx.fill();
            } else if (img.type === 'blur_diary') {
                // 安全的模糊实现：日记本纸张底色
                ctx.fillStyle = '#f4f1ea'; ctx.fillRect(bx, by, imgW, imgH); 
                
                // 绘制日记本横线
                ctx.strokeStyle = '#d7ccc8'; ctx.lineWidth = 1;
                for(let l=by+40; l<by+imgH; l+=30) {
                    ctx.beginPath(); ctx.moveTo(bx+15, l); ctx.lineTo(bx+imgW-15, l); ctx.stroke();
                }

                let cx = bx + 25, cy = by + 35;
                
                // 多段文字拆分，还原大段日记的视觉感，只让关键信息聚焦清晰
                let segments = [];
                if(img.id === 'img_004') {
                    segments = [
                        { t: "今天回家晚了……", blur: true },
                        { t: "爸又", blur: false },
                        { t: "无缘无故把我", blur: true },
                        { t: "骂哭", blur: false },
                        { t: "……躲在被子里听", blur: true },
                        { t: "耳机", blur: false },
                        { t: "……不想活了", blur: true }
                    ];
                } else if(img.id === 'img_005') {
                    segments = [
                        { t: "不知不觉", blur: true },
                        { t: "转学半年", blur: false },
                        { t: "了……还是", blur: true },
                        { t: "没人一起吃饭", blur: false },
                        { t: "……早就已经", blur: true },
                        { t: "习惯了", blur: false },
                        { t: "……", blur: true }
                    ];
                } else if(img.id === 'img_006') {
                    segments = [
                        { t: "外面一直在", blur: true },
                        { t: "打雷", blur: false },
                        { t: "……屋里好黑……我", blur: true },
                        { t: "不敢睡", blur: false },
                        { t: "……救救我……", blur: true }
                    ];
                }

                ctx.save();
                for (let seg of segments) {
                    if (seg.blur) {
                        ctx.filter = 'blur(2.5px)'; // 模糊的钢笔字
                        ctx.font = '20px "楷体", "Kaiti", serif';
                        ctx.fillStyle = '#546e7a';
                    } else {
                        ctx.filter = 'none'; // 焦点清晰的钢笔字
                        ctx.font = 'bold 22px "楷体", "Kaiti", serif';
                        ctx.fillStyle = '#2c3e50'; // 取消红色，使用同色系但更深的墨水色，不再突兀
                    }
                    
                    let chars = seg.t.split('');
                    for (let c of chars) {
                        let cw = ctx.measureText(c).width;
                        if (cx + cw > bx + imgW - 25) { 
                            cx = bx + 25; 
                            cy += 30; // 自动换行
                        }
                        ctx.fillText(c, cx, cy);
                        cx += cw;
                    }
                }
                ctx.restore();
            } else if (img.type === 'sharp_text') {
                ctx.fillStyle = '#efebe9'; ctx.fillRect(bx, by, imgW, imgH);
                ctx.fillStyle = '#111'; ctx.font = 'bold 16px Arial';
                let cy = by + 40;
                let lines = img.text.split('\n');
                for(let l of lines) { ctx.fillText(l, bx+15, cy); cy+=30; }
            } else if (img.type === 'group_photo') {
                ctx.fillStyle = '#90a4ae'; ctx.fillRect(bx, by, imgW, imgH);
                ctx.fillStyle = '#546e7a'; // 台阶阴影
                for(let i=0; i<4; i++) ctx.fillRect(bx, by + imgH*0.35 + i*35, imgW, 35);
                ctx.fillStyle = '#263238'; 
                // 绘制4排、每排10个人的剪影
                for(let row=0; row<4; row++) {
                    let cols = 10;
                    let spacing = imgW / cols;
                    let startY = by + imgH*0.35 + row*35 - 15;
                    for(let col=0; col<cols; col++) {
                        ctx.beginPath();
                        let px = bx + col*spacing + spacing/2 + (row%2)*6; // 稍微错开站位
                        ctx.arc(px, startY, 9, 0, Math.PI*2); // 头
                        ctx.fill();
                        ctx.fillRect(px - 10, startY + 8, 20, 25); // 身体
                    }
                }
            } else if (img.type === 'friends') {
                let grad = ctx.createLinearGradient(bx, by, bx, by+imgH);
                grad.addColorStop(0, '#ffcc80'); grad.addColorStop(1, '#ffab91'); // 黄昏背景
                ctx.fillStyle = grad; ctx.fillRect(bx, by, imgW, imgH);
                
                ctx.fillStyle = '#3e2723';
                // 左侧人物
                ctx.beginPath(); ctx.arc(bx + imgW*0.35, by + imgH*0.5, 28, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(bx + imgW*0.35 - 32, by + imgH*0.5 + 25, 64, imgH);
                // 右侧人物
                ctx.beginPath(); ctx.arc(bx + imgW*0.65, by + imgH*0.55, 26, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(bx + imgW*0.65 - 28, by + imgH*0.55 + 22, 56, imgH);
                // 勾肩搭背的手臂
                ctx.beginPath(); ctx.moveTo(bx + imgW*0.35, by + imgH*0.5 + 40);
                ctx.quadraticCurveTo(bx + imgW*0.5, by + imgH*0.5 + 20, bx + imgW*0.65 + 30, by + imgH*0.55 + 45);
                ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.strokeStyle = '#3e2723'; ctx.stroke();
            } else if (img.type === 'mp3') {
                ctx.fillStyle = '#8d6e63'; ctx.fillRect(bx, by, imgW, imgH); // 木质底色
                ctx.strokeStyle = '#795548'; ctx.lineWidth = 3;
                // 木纹肌理
                for(let i=0; i<6; i++) {
                    ctx.beginPath(); ctx.moveTo(bx, by + i*45); ctx.lineTo(bx+imgW, by + i*45 + (i%2==0?20:-20)); ctx.stroke();
                }
                
                // MP3 播放器机身
                let mp3X = bx + imgW/2 - 35, mp3Y = by + imgH/2 - 65, mp3W = 70, mp3H = 130;
                ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 15;
                ctx.fillStyle = '#f5f5f5'; roundRect(ctx, mp3X, mp3Y, mp3W, mp3H, 10, true, false);
                ctx.shadowBlur = 0;
                
                // 屏幕与按键环
                ctx.fillStyle = '#9e9e9e'; roundRect(ctx, mp3X + 8, mp3Y + 10, mp3W - 16, 45, 5, true, false); 
                ctx.fillStyle = '#b0bec5'; ctx.fillRect(mp3X + 12, mp3Y + 15, mp3W - 24, 35); // 屏幕亮起
                ctx.fillStyle = '#e0e0e0'; ctx.beginPath(); ctx.arc(mp3X + mp3W/2, mp3Y + 90, 22, 0, Math.PI*2); ctx.fill(); // 滚轮
                ctx.fillStyle = '#bdbdbd'; ctx.beginPath(); ctx.arc(mp3X + mp3W/2, mp3Y + 90, 8, 0, Math.PI*2); ctx.fill(); // 确认键
                
                // 耳机线与耳机头
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(mp3X + mp3W/2, mp3Y); 
                ctx.quadraticCurveTo(bx + imgW*0.9, by + 30, bx + imgW - 30, by + imgH - 20); ctx.stroke();
                ctx.beginPath(); ctx.arc(bx + imgW - 30, by + imgH - 15, 6, 0, Math.PI*2); ctx.fillStyle='#eee'; ctx.fill();
            } else {
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(bx, by, imgW, imgH);
                ctx.fillStyle = '#fff'; ctx.font = '16px Arial'; ctx.textAlign='center'; ctx.fillText(img.desc, bx+imgW/2, by+imgH/2); ctx.textAlign='left';
            }
            ctx.restore();

            ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3; ctx.strokeRect(bx, by, imgW, imgH);
            ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 18px Arial'; ctx.fillText(img.title, bx, by + imgH + 40);
            if(img.desc) { ctx.fillStyle = '#ccc'; ctx.font = '14px Arial'; wrapText(ctx, img.desc, bx, by + imgH + 70, imgW, 20); }
            
            maxScrollY = Math.max(0, by + imgH + 150 + scrollY - (sy + sh));
        }

        function drawQQMenu(sx, sy, sw, sh) {
            let cy = sy + 60;
            let menus = [
                {name: '联系人 (私聊)', cat: 'friends', icon: '👤', desc: '阿树, 念念想冬眠 等'}, 
                {name: '群组聊天', cat: 'groups', icon: '👥', desc: 'GAME OVER电玩, 高二三班 等'},
                {name: 'QQ空间动态', cat: 'qzone', icon: '🌟', desc: '异常拦截记录'}
            ];
            for (let i = 0; i < menus.length; i++) {
                let bx = sx + 20, by = cy + i*80, bw = sw - 40, bh = 70;
                let isHover = mouseX >= bx && mouseX <= bx+bw && mouseY >= by && mouseY <= by+bh;
                ctx.fillStyle = isHover ? 'rgba(46, 204, 113, 0.3)' : 'rgba(255,255,255,0.05)';
                ctx.strokeStyle = isHover ? '#2ecc71' : 'transparent'; ctx.lineWidth=2;
                roundRect(ctx, bx, by, bw, bh, 10, true, isHover);
                
                ctx.fillStyle = '#fff'; ctx.font = '30px Arial'; ctx.fillText(menus[i].icon, bx + 15, by + 45);
                ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 18px Arial'; ctx.fillText(menus[i].name, bx + 65, by + 35);
                ctx.fillStyle = '#aaa'; ctx.font = '12px Arial'; ctx.fillText(menus[i].desc, bx + 65, by + 55);
                
                addRegion(bx, by, bw, bh, () => { 
                    if (menus[i].cat === 'qzone') currentApp = 'qq_qzone';
                    else { currentApp = 'qq_list'; qqCategory = menus[i].cat; }
                    scrollY = 0; 
                });
            }
        }

        function drawQQList(sx, sy, sw, sh) {
            let list = qqCategory === 'groups' ? db.qq_group : db.qq_friends;
            let cy = sy + 60 - scrollY;
            for (let item of list) {
                let bx = sx + 10, by = cy, bh = 70;
                if (by + bh > sy && by < sy + sh) {
                    let isHover = mouseX >= bx && mouseX <= bx + sw - 20 && mouseY >= by && mouseY <= by + bh;
                    ctx.fillStyle = isHover ? 'rgba(255,255,255,0.1)' : 'transparent'; ctx.fillRect(bx, by, sw - 20, bh);
                    
                    ctx.fillStyle = qqCategory === 'groups' ? '#e67e22' : '#9b59b6';
                    ctx.beginPath(); ctx.arc(bx + 35, by + 35, 22, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign='center';
                    ctx.fillText(item.avatar || (qqCategory==='groups'?'👥':'👤'), bx + 35, by + 43);
                    
                    ctx.textAlign='left'; ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 16px Arial';
                    ctx.fillText(item.name + (item.members ? ` (${item.members}人)` : ''), bx + 70, by + 35);
                    
                    let lastMsg = item.messages[item.messages.length-1].text.replace(/\n/g, ' ');
                    ctx.fillStyle = '#aaa'; ctx.font = '12px Arial';
                    ctx.fillText(lastMsg.length > 20 ? lastMsg.substring(0,20)+"..." : lastMsg, bx + 70, by + 55);
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.moveTo(bx, by + bh); ctx.lineTo(bx + sw - 20, by + bh); ctx.stroke();
                    
                    addRegion(bx, by, sw - 20, bh, () => { selectedQQId = item.id; currentApp = 'qq_chat'; scrollY = 0; });
                }
                cy += bh;
            }
            maxScrollY = Math.max(0, cy + scrollY - (sy + sh));
        }

        function drawQQChat(sx, sy, sw, sh) {
            let cy = sy + 60 - scrollY; 
            let dataList = qqCategory === 'groups' ? db.qq_group : db.qq_friends;
            let chatData = dataList.find(c => c.id === selectedQQId);
            if (!chatData) return;

            for (let m of chatData.messages) {
                if (m.type === 'time' || m.type === 'system') {
                    if (cy > sy && cy < sy + sh) {
                        ctx.fillStyle = '#888'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
                        let lines = m.text.split('\n');
                        for(let i=0; i<lines.length; i++) ctx.fillText(lines[i], sx + sw/2, cy + i*16);
                        ctx.textAlign = 'left';
                    }
                    cy += 40;
                } else {
                    let isMe = m.type === 'me';
                    ctx.font = '14px Arial';
                    let textWidth = ctx.measureText(m.text).width;
                    let maxBubbleW = sw * 0.6;
                    let bubbleW = Math.min(textWidth + 20, maxBubbleW);
                    let bubbleH = 30 + Math.floor(textWidth / maxBubbleW) * 20;
                    
                    if (cy + bubbleH + 30 > sy && cy < sy + sh) {
                        let bx = isMe ? sx + sw - bubbleW - 55 : sx + 55;
                        
                        let avX = isMe ? sx + sw - 30 : sx + 30;
                        ctx.fillStyle = isMe ? '#95a5a6' : '#8e44ad';
                        if(m.sender==='念念想冬眠') ctx.fillStyle = '#74b9ff';
                        if(m.sender==='阿树') ctx.fillStyle = '#e67e22';
                        ctx.beginPath(); ctx.arc(avX, cy + 15, 18, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle='#fff'; ctx.font='18px Arial'; ctx.textAlign='center';
                        let avIcon = m.sender==='念念想冬眠' ? '👧' : (m.sender==='阿树' ? '👦' : m.sender.charAt(0));
                        if(isMe) avIcon = '🪨';
                        ctx.fillText(avIcon, avX, cy+22);
                        
                        ctx.fillStyle = '#aaa'; ctx.font = '12px Arial'; ctx.textAlign = isMe ? 'right' : 'left';
                        ctx.fillText(m.sender, isMe ? sx + sw - 60 : sx + 60, cy);
                        
                        ctx.fillStyle = isMe ? '#e1f5fe' : '#ffffff'; ctx.textAlign = 'left';
                        roundRect(ctx, bx, cy + 5, bubbleW, bubbleH, 8, true, false);
                        ctx.fillStyle = '#333'; ctx.font = '13px Arial';
                        wrapText(ctx, m.text, bx + 10, cy + 22, bubbleW - 20, 18);
                    }
                    cy += bubbleH + 30;
                }
            }
            maxScrollY = Math.max(0, cy + scrollY - (sy + sh) + 50);
        }

        function drawQQZone(sx, sy, sw, sh) {
            let cy = sy + 60 - scrollY; 
            for (let post of db.qq_qzone) {
                let bx = sx + 20;
                if (cy + 100 > sy && cy < sy + sh) {
                    ctx.fillStyle = '#74b9ff'; ctx.beginPath(); ctx.arc(bx+20, cy+20, 20, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = '22px Arial'; ctx.textAlign='center'; ctx.fillText(post.avatar, bx+20, cy+28);
                    ctx.textAlign='left';
                    
                    ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 16px Arial'; ctx.fillText(post.sender, bx + 55, cy + 15);
                    ctx.fillStyle = '#888'; ctx.font = '12px Arial'; ctx.fillText(post.time, bx + 55, cy + 32);
                }
                cy += 60;
                
                ctx.fillStyle = '#ddd'; ctx.font = '14px Arial';
                let th = wrapText(ctx, post.text, bx, cy, sw - 40, 22);
                cy += th + 20;
                
                ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.moveTo(bx, cy); ctx.lineTo(bx + sw - 40, cy); ctx.stroke();
                cy += 20;
            }
            maxScrollY = Math.max(0, cy + scrollY - (sy + sh));
        }

        function draw() {
            clickRegions = []; // Clear per frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (gameState === 'START_SCREEN') drawStartScreen();
            else if (gameState === 'PASSWORD_INPUT') drawPasswordScreen();
            else if (gameState === 'ASHU_PHONE') drawAshuPhone();
            else if (gameState === 'GAME_OVER') drawGameOverScreen();
            else drawMainUI();
            
            timeTick++;
            requestAnimationFrame(draw);
        }

        canvas.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
        });

        canvas.addEventListener('mousedown', e => {
            for (let i = clickRegions.length - 1; i >= 0; i--) {
                let r = clickRegions[i];
                if (mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h) {
                    r.onClick(); break; // Stop at highest z-index element
                }
            }
        });

        canvas.addEventListener('wheel', e => {
            e.preventDefault(); 
            let scrollable = ['sms_list', 'sms_detail', 'gallery_list', 'qq_list', 'qq_chat', 'qq_qzone', 'whale_app', 'notes', 'contacts'];
            if (gameState === 'DESKTOP' && scrollable.includes(currentApp)) {
                scrollY += e.deltaY * 0.5;
                scrollY = Math.max(0, Math.min(maxScrollY, scrollY));
            }
        }, { passive: false });

        resize();
        draw();
    </script>
</body>
</html>
