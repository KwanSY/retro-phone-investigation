<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验室现场电子物证取证系统 - S40-PROJ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #040608;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-image: radial-gradient(circle at center, #111a24 0%, #020305 100%);
        }
        canvas {
            background-color: #0b0f14;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 150, 255, 0.1);
            border-radius: 12px;
            cursor: default;
            outline: none;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1050" height="680" tabindex="0"></canvas>

<script>
    // --- 确保元素获取成功 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.focus();
    canvas.addEventListener('click', () => canvas.focus());

    // --- 游戏状态定义 ---
    const GAME_STATES = {
        HOME: 0,
        SMS_LIST: 1,
        SMS_VIEW: 2,
        GALLERY_LOCK: 8, 
        GALLERY_LIST: 3,
        GALLERY_VIEW: 4,
        AUDIO_LIST: 5,
        AUDIO_PLAY: 6,
        VICTORY: 7,
        DUMMY_MOD: 9 
    };

    let currentState = GAME_STATES.HOME;
    let selectedItemIndex = -1; 
    let currentDummyTitle = "";
    
    let enteredPassword = "";
    let lockMessage = "请输入安全码 (提示:嫌疑人出生年份):";
    let isPasswordError = false;
    
    // 物证数据
    const db = {
        sms: [
            { id: 1, sender: "神秘线人", text: "目标昨晚在老地方出现了。仔细看相册里的照片，相册密码是嫌疑犯出生的年份（1930）。", read: false },
            { id: 2, sender: "局长", text: "案子办得怎么样了？这部诺基亚5300是关键物证，里面有嫌疑犯的语音记录，务必查听。", read: false }
        ],
        photos: [
            { id: 1, title: "现场脚印", color: "#8e44ad", type: "footprint", read: false },
            { id: 2, title: "遗落的钥匙", color: "#f39c12", type: "key", read: false }
        ],
        audios: [
            { id: 1, title: "录音_001.amr", duration: 180, progress: 0, playing: false, read: false }, 
            { id: 2, title: "未知通话记录", duration: 250, progress: 0, playing: false, read: false }
        ]
    };

    let clickRegions = [];
    let mouseX = 0;
    let mouseY = 0;

    // 案发现场背景尘埃粒子
    const dustParticles = [];
    for(let i=0; i<40; i++) {
        dustParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.5 + 0.5,
            vx: (Math.random() - 0.5) * 0.2,
            vy: (Math.random() - 1) * 0.3,
            alpha: Math.random() * 0.5 + 0.1
        });
    }

    // --- 事件监听 ---
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
        
        let hovering = false;
        for (let region of clickRegions) {
            if (mouseX >= region.x && mouseX <= region.x + region.w &&
                mouseY >= region.y && mouseY <= region.y + region.h) {
                hovering = true;
                break;
            }
        }
        canvas.style.cursor = hovering ? 'pointer' : 'default';
    });

    canvas.addEventListener('mousedown', (e) => {
        if (currentState === GAME_STATES.VICTORY) return;

        for (let i = clickRegions.length - 1; i >= 0; i--) {
            const region = clickRegions[i];
            if (mouseX >= region.x && mouseX <= region.x + region.w &&
                mouseY >= region.y && mouseY <= region.y + region.h) {
                region.onClick();
                checkVictory();
                break; 
            }
        }
    });

    canvas.addEventListener('keydown', (e) => {
        if (currentState === GAME_STATES.GALLERY_LOCK) {
            if (e.key >= '0' && e.key <= '9' && enteredPassword.length < 8) {
                enteredPassword += e.key;
            } else if (e.key === 'Backspace' && enteredPassword.length > 0) {
                enteredPassword = enteredPassword.slice(0, -1);
            } else if (e.key === 'Enter') {
                validatePassword();
            }
        }
    });

    function getCollectedCount() {
        let count = 0;
        if (db.sms.every(s => s.read)) count++;
        if (db.photos.every(p => p.read)) count++;
        if (db.audios.every(a => a.read)) count++;
        return count;
    }

    function checkVictory() {
        const smsDone = db.sms.every(item => item.read);
        const photosDone = db.photos.every(item => item.read);
        const audiosDone = db.audios.every(item => item.read);
        
        if (smsDone && photosDone && audiosDone && currentState !== GAME_STATES.VICTORY) {
            setTimeout(() => { currentState = GAME_STATES.VICTORY; }, 500);
        }
    }

    function validatePassword() {
        if (enteredPassword === "1930") {
            enteredPassword = ""; 
            currentState = GAME_STATES.GALLERY_LIST;
        } else {
            isPasswordError = true;
            lockMessage = "密码错误！请查阅短信线索";
            setTimeout(() => {
                isPasswordError = false;
                lockMessage = "请输入安全码 (提示:嫌疑人出生年份):";
                enteredPassword = "";
            }, 1200);
        }
    }

    // --- 稳定的圆角矩形方法 ---
    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) { ctx.fill(); }
        if (stroke) { ctx.stroke(); }
    }

    function addRegion(x, y, w, h, onClick) {
        clickRegions.push({ x, y, w, h, onClick });
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        let words = text.split('');
        let line = '';
        let currentY = y;
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n];
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, currentY);
                line = words[n]; currentY += lineHeight;
            } else { line = testLine; }
        }
        ctx.fillText(line, x, currentY);
    }

    // --- 渲染模块 ---
    function drawBackground() {
        let bgGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, 700);
        bgGrad.addColorStop(0, '#131b24');
        bgGrad.addColorStop(0.6, '#080c10');
        bgGrad.addColorStop(1, '#020304');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

        ctx.fillStyle = '#8a99a8'; ctx.font = '11px Courier New';
        ctx.fillText("实验现场电子物证取证系统  S40-PROJ  |  设备状态: 已连接  |  当前案件: 2006-04-13", 30, 25);

        ctx.fillStyle = '#fff';
        dustParticles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.y < 0) p.y = canvas.height;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawDataCable() {
        const startX = 290;
        const startY = 320;
        const endX = 570; 
        const endY = 320;

        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(startX + 120, startY - 80, endX - 120, endY - 80, endX, endY); ctx.stroke();

        ctx.strokeStyle = '#222'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(startX + 120, startY - 80, endX - 120, endY - 80, endX, endY); ctx.stroke();

        let time = Date.now() / 250;
        let progress = (time % 2) / 2;
        
        ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.setLineDash([15, 40]); ctx.lineDashOffset = -progress * 55;
        ctx.beginPath(); ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(startX + 120, startY - 80, endX - 120, endY - 80, endX, endY); ctx.stroke();

        ctx.setLineDash([]);
        ctx.fillStyle = '#00a8ff'; ctx.font = '10px Courier New'; ctx.textAlign = 'center';
        ctx.fillText("S40/Diag", (startX + endX)/2, startY - 55);
        ctx.fillText("USB-2.0", (startX + endX)/2, startY - 42);
        ctx.restore();
    }

    function drawStaticPhone() {
        const x = 70, y = 80, w = 220, h = 480;

        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 25; ctx.shadowOffsetX = 10; ctx.shadowOffsetY = 15;
        roundRect(ctx, 5, 5, w-10, h-10, 25, true, false);
        ctx.restore(); 

        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = '#f2f2f2'; roundRect(ctx, 0, 0, w, h, 25, true, false);

        let redGrad = ctx.createLinearGradient(0, 0, w, 0);
        redGrad.addColorStop(0, '#901212'); redGrad.addColorStop(0.2, '#d63031');
        redGrad.addColorStop(0.8, '#d63031'); redGrad.addColorStop(1, '#901212');
        ctx.fillStyle = redGrad;
        
        ctx.beginPath();
        ctx.moveTo(25, 0); ctx.lineTo(w - 25, 0); ctx.quadraticCurveTo(w, 0, w, 25);
        ctx.lineTo(w, 290); ctx.lineTo(0, 290);
        ctx.lineTo(0, 25); ctx.quadraticCurveTo(0, 0, 25, 0); ctx.fill();

        ctx.fillStyle = '#e74c3c'; ctx.fillRect(-4, 75, 4, 25); ctx.fillRect(-4, 115, 4, 25); ctx.fillRect(-4, 155, 4, 25);

        ctx.fillStyle = '#333'; roundRect(ctx, w/2 - 25, 12, 50, 6, 3, true, false);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center'; ctx.fillText("NOKIA", w/2, 35);

        const scrX = 20, scrY = 45, scrW = w - 40, scrH = 145;
        ctx.fillStyle = '#0a1017'; roundRect(ctx, scrX, scrY, scrW, scrH, 6, true, false);

        let sGrad = ctx.createLinearGradient(scrX, scrY, scrX, scrY + scrH);
        sGrad.addColorStop(0, '#8e44ad'); sGrad.addColorStop(0.5, '#2980b9'); sGrad.addColorStop(1, '#16a085');
        ctx.fillStyle = sGrad; ctx.fillRect(scrX+2, scrY+2, scrW-4, scrH-4);

        ctx.fillStyle = '#fff'; ctx.font = '10px Arial'; ctx.fillText("📶 🔋  10:09 AM", scrX + scrW/2, scrY + 16);
        ctx.font = 'bold 12px Arial'; ctx.fillText("NOKIA 5300", scrX + scrW/2, scrY + 45);
        ctx.font = '11px Arial'; ctx.fillText("Get Ready - track 03", scrX + scrW/2, scrY + 65);
        
        ctx.beginPath(); ctx.arc(scrX + scrW/2, scrY + 105, 18, 0, Math.PI*2); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(scrX + scrW/2 - 5, scrY + 97); ctx.lineTo(scrX + scrW/2 + 8, scrY + 105); ctx.lineTo(scrX + scrW/2 - 5, scrY + 113); ctx.fillStyle = '#fff'; ctx.fill();

        const funcY = 205;
        ctx.fillStyle = '#f8f8f8'; roundRect(ctx, 12, funcY, w - 24, 80, 10, true, false);

        let dX = w/2, dY = funcY + 38, dR = 26;
        ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(dX, dY, dR, 0, Math.PI*2); ctx.stroke(); 
        ctx.fillStyle = '#e8e8e8'; ctx.beginPath(); ctx.arc(dX, dY, dR-2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; roundRect(ctx, dX - 8, dY - 8, 16, 16, 3, true, false);

        ctx.fillStyle = '#3498db'; roundRect(ctx, dX - dR - 35, dY - 14, 28, 7, 3, true, false); roundRect(ctx, dX + dR + 7, dY - 14, 28, 7, 3, true, false); 
        ctx.fillStyle = '#27ae60'; roundRect(ctx, dX - dR - 35, dY + 6, 28, 10, 4, true, false);
        ctx.fillStyle = '#c0392b'; roundRect(ctx, dX + dR + 7, dY + 6, 28, 10, 4, true, false);

        ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(15, 305); ctx.lineTo(w - 15, 305); ctx.stroke();
        ctx.fillStyle = '#111'; roundRect(ctx, w/2 - 12, h - 14, 24, 5, 2, true, false); 
        ctx.beginPath(); ctx.arc(w/2 - 40, h - 11, 4, 0, Math.PI*2); ctx.fill(); 

        ctx.restore();
    }

    function drawActiveScreen() {
        // --- 核心修改：修长的屏幕比例 (宽度从 510 缩为 380) ---
        const x = 570, y = 50, w = 380, h = 590;

        ctx.save();
        
        // --- 核心修改：发出强烈的幽蓝光 ---
        ctx.shadowColor = '#00a8ff';
        ctx.shadowBlur = 40;
        ctx.fillStyle = '#101824';
        roundRect(ctx, x, y, w, h, 14, true, false);
        ctx.shadowColor = 'transparent';
        
        ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 3;
        roundRect(ctx, x, y, w, h, 14, false, true);

        // 顶部栏
        ctx.fillStyle = '#0a101a'; ctx.beginPath(); ctx.moveTo(x+14, y); ctx.lineTo(x+w-14, y); ctx.lineTo(x+w, y+14); ctx.lineTo(x+w, y+40); ctx.lineTo(x, y+40); ctx.lineTo(x, y+14); ctx.fill();
        ctx.fillStyle = '#00a8ff'; ctx.font = 'bold 13px Courier New'; ctx.fillText("🖥️ S40 镜像侦测屏", x + 15, y + 25);

        ctx.save();
        ctx.translate(x + w - 70, y + 20); ctx.rotate(-0.1);
        ctx.fillStyle = 'rgba(214, 48, 49, 0.2)'; ctx.strokeStyle = '#d63031'; ctx.lineWidth = 1.5;
        roundRect(ctx, -35, -12, 70, 24, 4, true, true);
        ctx.fillStyle = '#d63031'; ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center'; ctx.fillText("绝密/SECRET", 0, 4);
        ctx.restore();

        const sx = x + 20, sy = y + 55, sw = w - 40, sh = h - 115;
        ctx.save();
        ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();

        // 蓝光屏幕内背景渐变
        let bgGrad = ctx.createLinearGradient(sx, sy, sx, sy + sh);
        bgGrad.addColorStop(0, '#00264d'); 
        bgGrad.addColorStop(0.5, '#004080'); 
        bgGrad.addColorStop(1, '#00264d');
        ctx.fillStyle = bgGrad; ctx.fillRect(sx, sy, sw, sh);
        
        switch(currentState) {
            case GAME_STATES.HOME: drawHome(sx, sy, sw, sh); break;
            case GAME_STATES.SMS_LIST: drawSymbianList(sx, sy, sw, sh, "信息", db.sms, "✉️", "📜", GAME_STATES.SMS_VIEW); break;
            case GAME_STATES.SMS_VIEW: drawSmsView(sx, sy, sw, sh); break;
            case GAME_STATES.GALLERY_LOCK: drawGalleryLock(sx, sy, sw, sh); break;
            case GAME_STATES.GALLERY_LIST: drawSymbianList(sx, sy, sw, sh, "图库", db.photos, "🖼️", "🖼️", GAME_STATES.GALLERY_VIEW); break;
            case GAME_STATES.GALLERY_VIEW: drawGalleryView(sx, sy, sw, sh); break;
            case GAME_STATES.AUDIO_LIST: drawSymbianList(sx, sy, sw, sh, "录音机", db.audios, "🎵", "🎵", GAME_STATES.AUDIO_PLAY); break;
            case GAME_STATES.AUDIO_PLAY: drawAudioPlay(sx, sy, sw, sh); break;
            case GAME_STATES.DUMMY_MOD: drawDummyModule(sx, sy, sw, sh); break;
            case GAME_STATES.VICTORY: drawVictory(sx, sy, sw, sh); break;
        }

        if (currentState !== GAME_STATES.VICTORY) {
            drawStatusBar(sx, sy, sw);
            let leftBtn = "选项", centerBtn = currentState === GAME_STATES.HOME ? "菜单" : "", rightBtn = currentState === GAME_STATES.HOME ? "退出" : "返回";
            let leftAction = () => { };
            let rightAction = currentState === GAME_STATES.HOME ? null : () => { currentState = GAME_STATES.HOME; };
            if(currentState === GAME_STATES.SMS_VIEW) rightAction = () => { currentState = GAME_STATES.SMS_LIST; };
            if(currentState === GAME_STATES.GALLERY_VIEW) rightAction = () => { currentState = GAME_STATES.GALLERY_LIST; };
            if(currentState === GAME_STATES.AUDIO_PLAY) rightAction = () => { currentState = GAME_STATES.AUDIO_LIST; };
            if(currentState === GAME_STATES.DUMMY_MOD) rightAction = () => { currentState = GAME_STATES.HOME; };
            
            if(currentState === GAME_STATES.GALLERY_LOCK) {
                leftBtn = "确认"; rightBtn = enteredPassword.length > 0 ? "清除" : "返回";
                leftAction = () => { validatePassword(); };
                rightAction = () => { if (enteredPassword.length > 0) enteredPassword = enteredPassword.slice(0, -1); else { enteredPassword = ""; currentState = GAME_STATES.HOME; } };
            }
            drawSoftKeys(sx, sy, sw, sh, leftBtn, centerBtn, rightBtn, leftAction, rightAction);
        }
        ctx.restore();

        const footerY = y + h - 50;
        ctx.fillStyle = '#0a101a'; ctx.fillRect(x, footerY, w, 50);
        ctx.fillStyle = '#fff'; ctx.font = '12px Tahoma'; ctx.fillText("💡 点击菜单提取物证！", x + 15, footerY + 28);
        
        let collected = getCollectedCount();
        ctx.fillStyle = '#00a8ff'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'right'; ctx.fillText(`物证: ${collected}/3`, x + w - 15, footerY + 28); ctx.textAlign = 'left';
        ctx.restore();
    }

    function drawStatusBar(sx, sy, sw) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(sx, sy, sw, 25);
        ctx.fillStyle = '#fff';
        let sigX = sx + 10, sigY = sy + 18;
        ctx.beginPath(); ctx.moveTo(sigX, sigY); ctx.lineTo(sigX+8, sigY); ctx.lineTo(sigX+4, sigY-12); ctx.fill();
        for(let i=0; i<4; i++) { ctx.fillRect(sigX + 12 + i*5, sigY - 2 - i*2, 3, 3 + i*2); }
        
        let batX = sx + sw - 40, batY = sy + 6;
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(batX, batY, 20, 10);
        ctx.fillRect(batX + 2, batY + 2, 14, 6); ctx.fillRect(batX + 20, batY + 4, 2, 4); 
        ctx.font = '11px Tahoma'; ctx.textAlign = 'center'; ctx.fillText("中国移动 GSM", sx + sw/2, sy + 16); ctx.textAlign = 'left';
    }

    function drawSoftKeys(sx, sy, sw, sh, leftTxt, centerTxt, rightTxt, leftAction, rightAction) {
        const softKeyY = sy + sh - 28;
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(sx, softKeyY, sw, 28);
        ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 14px Tahoma';
        ctx.textAlign = 'left'; ctx.fillText(leftTxt, sx + 12, softKeyY + 19);
        if (centerTxt) { ctx.textAlign = 'center'; ctx.fillText(centerTxt, sx + sw/2, softKeyY + 19); }
        ctx.textAlign = 'right'; ctx.fillText(rightTxt, sx + sw - 12, softKeyY + 19); ctx.textAlign = 'left'; 

        if (leftAction) addRegion(sx, softKeyY, 110, 28, leftAction);
        if (rightAction) addRegion(sx + sw - 110, softKeyY, 110, 28, rightAction);
    }

    // --- 适配窄屏的 3x3 九宫格 ---
    function drawHome(sx, sy, sw, sh) {
        ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.font = 'bold 35px Arial'; ctx.textAlign = 'center'; ctx.fillText("S40 OS", sx + sw/2, sy + 60); ctx.textAlign = 'left';

        const gridY = sy + 80; const cols = 3, rows = 3;
        const padX = 15, padY = 15;
        const iconW = 85, iconH = 80; // 缩小图标尺寸适配窄屏
        const startX = sx + (sw - (cols * iconW + (cols - 1) * padX)) / 2;

        const apps = [
            { label: "短消息", icon: "✉️", state: GAME_STATES.SMS_LIST, done: db.sms.every(s=>s.read) },
            { label: "图库", icon: "🖼️", state: GAME_STATES.GALLERY_LOCK, done: db.photos.every(p=>p.read) },
            { label: "备忘", icon: "🎵", state: GAME_STATES.AUDIO_LIST, done: db.audios.every(a=>a.read) },
            { label: "通讯录", icon: "📇", state: GAME_STATES.DUMMY_MOD, title: "通讯录" },
            { label: "日历", icon: "📅", state: GAME_STATES.DUMMY_MOD, title: "日程日历" },
            { label: "设置", icon: "⚙️", state: GAME_STATES.DUMMY_MOD, title: "系统设置" },
            { label: "媒体", icon: "📻", state: GAME_STATES.AUDIO_LIST, done: db.audios.every(a=>a.read) },
            { label: "备忘录", icon: "📝", state: GAME_STATES.DUMMY_MOD, title: "备忘录" },
            { label: "游戏", icon: "🐍", state: GAME_STATES.DUMMY_MOD, title: "小游戏" }
        ];

        apps.forEach((app, index) => {
            let col = index % cols, row = Math.floor(index / cols);
            let bx = startX + col * (iconW + padX), by = gridY + row * (iconH + padY);
            let isHover = (mouseX >= bx && mouseX <= bx + iconW && mouseY >= by && mouseY <= by + iconH);
            
            if (isHover) {
                ctx.fillStyle = 'rgba(0, 240, 255, 0.2)'; ctx.fillRect(bx, by, iconW, iconH);
                ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, iconW, iconH);
            }

            ctx.font = '28px Arial'; ctx.textAlign = 'center'; ctx.fillText(app.icon, bx + iconW/2, by + 40);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Tahoma'; ctx.fillText(app.label, bx + iconW/2, by + 65);

            if (app.done !== undefined) {
                if (app.done) { ctx.fillStyle = '#27ae60'; ctx.font = '12px Arial'; ctx.fillText("✔", bx + iconW - 16, by + 20); } 
                else { ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(bx + iconW - 14, by + 16, 5, 0, Math.PI*2); ctx.fill(); }
            }
            addRegion(bx, by, iconW, iconH, () => {
                if (app.state === GAME_STATES.DUMMY_MOD) { currentDummyTitle = app.title; currentState = GAME_STATES.DUMMY_MOD; } 
                else { currentState = app.state; }
            });
        });
    }

    function drawDummyModule(sx, sy, sw, sh) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx, sy + 25, sw, 35);
        ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 16px Tahoma'; ctx.fillText(currentDummyTitle, sx + 12, sy + 48);
        ctx.fillStyle = '#fff'; ctx.font = '15px Tahoma'; ctx.textAlign = 'center';
        ctx.fillText("⚠️ 模块已损坏", sx + sw/2, sy + 160);
        ctx.fillStyle = '#aaa'; ctx.font = '13px Tahoma'; ctx.fillText("未发现关联物证。", sx + sw/2, sy + 195); ctx.textAlign = 'left';
    }

    function drawGalleryLock(sx, sy, sw, sh) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx, sy + 25, sw, 35);
        ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 16px Tahoma'; ctx.fillText("安全加密", sx + 12, sy + 48);

        ctx.fillStyle = isPasswordError ? '#e74c3c' : '#fff'; ctx.font = '13px Tahoma';
        ctx.textAlign = 'center'; ctx.fillText(lockMessage, sx + sw/2, sy + 85);

        let boxW = 160, boxX = sx + (sw - boxW) / 2, boxY = sy + 105;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(boxX, boxY, 160, 36);
        ctx.strokeStyle = isPasswordError ? '#e74c3c' : '#00f0ff'; ctx.lineWidth = 2; ctx.strokeRect(boxX, boxY, 160, 36);
        ctx.fillStyle = '#fff'; ctx.font = '24px Arial';
        let stars = ""; for(let i=0; i<enteredPassword.length; i++) stars += "*"; ctx.fillText(stars, sx + sw/2, boxY + 27); ctx.textAlign = 'left';

        let padCols = 3, keyW = 60, keyH = 40, padMargin = 12;
        let padStartX = sx + (sw - (padCols * keyW + (padCols - 1) * padMargin)) / 2, padStartY = sy + 170;
        const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'];

        keys.forEach((key, index) => {
            let col = index % padCols, row = Math.floor(index / padCols);
            let kx = padStartX + col * (keyW + padMargin), ky = padStartY + row * (keyH + padMargin);
            let isHover = (mouseX >= kx && mouseX <= kx + keyW && mouseY >= ky && mouseY <= ky + keyH);
            
            ctx.fillStyle = isHover ? 'rgba(0,240,255,0.4)' : 'rgba(255,255,255,0.1)'; roundRect(ctx, kx, ky, keyW, keyH, 6, true, false);
            ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 1; roundRect(ctx, kx, ky, keyW, keyH, 6, false, true);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Tahoma'; ctx.textAlign = 'center'; ctx.fillText(key, kx + keyW/2, ky + keyH/2 + 6); ctx.textAlign = 'left';
            addRegion(kx, ky, keyW, keyH, () => { if (key >= '0' && key <= '9' && enteredPassword.length < 8) { enteredPassword += key; } });
        });
    }

    function drawSymbianList(sx, sy, sw, sh, title, dataArray, unreadIcon, readIcon, nextState) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx, sy + 25, sw, 35);
        ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 16px Tahoma'; ctx.fillText(title, sx + 12, sy + 48);

        const listStartY = sy + 65; const rowH = 55;
        dataArray.forEach((item, index) => {
            let rowY = listStartY + index * rowH;
            let isHover = (mouseX >= sx && mouseX <= sx + sw && mouseY >= rowY && mouseY <= rowY + rowH);
            
            ctx.fillStyle = isHover ? 'rgba(0,168,255,0.3)' : 'transparent'; ctx.fillRect(sx, rowY, sw, rowH);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx, rowY + rowH); ctx.lineTo(sx + sw, rowY + rowH); ctx.stroke();
            
            ctx.fillStyle = '#fff'; ctx.font = '20px Arial'; ctx.fillText(item.read ? readIcon : unreadIcon, sx + 12, rowY + 35);
            ctx.font = '15px Tahoma'; ctx.fillText(item.sender || item.title, sx + 45, rowY + 34);
            addRegion(sx, rowY, sw, rowH, () => {
                selectedItemIndex = index;
                if(nextState === GAME_STATES.AUDIO_PLAY) { dataArray[index].progress = 0; dataArray[index].playing = true; } else { item.read = true; }
                currentState = nextState;
            });
        });
    }

    function drawSmsView(sx, sy, sw, sh) {
        const msg = db.sms[selectedItemIndex];
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx, sy + 25, sw, 35);
        ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 15px Tahoma'; ctx.fillText("发件人: " + msg.sender, sx + 12, sy + 48);
        ctx.fillStyle = '#fff'; ctx.font = '15px Tahoma'; wrapText(ctx, msg.text, sx + 15, sy + 90, sw - 30, 26);
    }

    function drawGalleryView(sx, sy, sw, sh) {
        const photo = db.photos[selectedItemIndex];
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx, sy + 25, sw, 35);
        ctx.fillStyle = '#00f0ff'; ctx.font = '15px Tahoma'; ctx.fillText(photo.title, sx + 12, sy + 48);

        ctx.save(); ctx.translate(sx + sw/2, sy + sh/2 + 10);
        ctx.fillStyle = '#fff'; ctx.fillRect(-105, -105, 210, 210);
        ctx.fillStyle = photo.color; ctx.fillRect(-95, -95, 190, 190);
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        if (photo.type === 'footprint') {
            ctx.beginPath(); ctx.ellipse(0, 10, 35, 55, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-25, -60, 12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -70, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(38, -50, 8, 0, Math.PI*2); ctx.fill();
        } else if (photo.type === 'key') {
            ctx.beginPath(); ctx.arc(-45, 0, 25, 0, Math.PI*2); ctx.fill();
            ctx.fillRect(-20, -7, 90, 14); ctx.fillRect(35, -7, 10, 30); ctx.fillRect(55, -7, 10, 25);
            ctx.fillStyle = photo.color; ctx.beginPath(); ctx.arc(-45, 0, 10, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }

    function drawAudioPlay(sx, sy, sw, sh) {
        const audio = db.audios[selectedItemIndex];
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Tahoma'; ctx.textAlign = 'center'; ctx.fillText("🎵 音频分析", sx + sw/2, sy + 80);
        ctx.fillStyle = '#00f0ff'; ctx.font = '16px Tahoma'; ctx.fillText(audio.title, sx + sw/2, sy + 110);

        let centerY = sy + 230;
        ctx.beginPath(); ctx.arc(sx + sw/2, centerY, 45, 0, Math.PI*2); 
        ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill(); ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3; ctx.stroke();
        
        ctx.fillStyle = '#00f0ff';
        if (audio.playing) { ctx.fillRect(sx + sw/2 - 12, centerY - 16, 8, 32); ctx.fillRect(sx + sw/2 + 4, centerY - 16, 8, 32); } 
        else { ctx.beginPath(); ctx.moveTo(sx + sw/2 - 8, centerY - 16); ctx.lineTo(sx + sw/2 + 16, centerY); ctx.lineTo(sx + sw/2 - 8, centerY + 16); ctx.fill(); }

        let barY = centerY + 85;
        ctx.fillStyle = 'rgba(255,255,255,0.2)'; roundRect(ctx, sx + 30, barY, sw - 60, 6, 3, true, false);
        let progressRatio = audio.progress / audio.duration;
        ctx.fillStyle = '#00f0ff'; roundRect(ctx, sx + 30, barY, (sw - 60) * progressRatio, 6, 3, true, false);
        ctx.beginPath(); ctx.arc(sx + 30 + (sw - 60) * progressRatio, barY + 3, 6, 0, Math.PI*2); ctx.fill();
        ctx.textAlign = 'left';

        if (audio.playing) { audio.progress++; if (audio.progress >= audio.duration) { audio.playing = false; audio.read = true; } }
    }

    function drawVictory(sx, sy, sw, sh) {
        ctx.fillStyle = 'rgba(0, 50, 20, 0.9)'; ctx.fillRect(sx, sy, sw, sh);
        ctx.fillStyle = '#2ecc71'; ctx.textAlign = 'center'; ctx.font = 'bold 35px Tahoma'; ctx.fillText("案件告破", sx + sw/2, sy + sh/2 - 40);
        ctx.fillStyle = '#fff'; ctx.font = '16px Tahoma'; ctx.fillText("所有核心物证已提取！", sx + sw/2, sy + sh/2 + 10); ctx.textAlign = 'left';
    }

    // --- 启动主循环 ---
    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        clickRegions = []; 

        drawBackground();
        drawDataCable();
        drawStaticPhone();
        drawActiveScreen();

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
